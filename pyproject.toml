[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nvfp4-attn-kernel"
version = "0.1.0"
description = "NVFP4 paged-decode kernel interface"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "nvidia-cutlass-dsl==4.4.0.dev0",
    "cuda-python",
    "typing_extensions",
    "apache-tvm-ffi==0.1.6",
    "torch-c-dlpack-ext",
]

[project.optional-dependencies]
test = [
    "pytest",
    "flash-attn",
    "flashinfer-python",
    "datasets",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
